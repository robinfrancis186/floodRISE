global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: floodrise
    environment: demo

rule_files:
  - /etc/prometheus/alerts.yml

# There is deliberately no Alertmanager target in the demo stack. Alerts stay
# visible in Prometheus/Grafana and cannot fan out to a production destination.
alerting:
  alertmanagers: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: floodrise-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8787"]
        labels:
          environment: demo
          service: floodrise-backend
          release: local
          demo_mode: "true"
          incident_mode: demo

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
