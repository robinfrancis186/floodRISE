[project]
name = "floodrise-backend"
version = "0.1.0"
description = "floodRISE Chennai flood intelligence competition MVP API"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0,<1",
  "alembic>=1.16.5,<2",
  "celery[redis]>=5.6.3,<6",
  "fastapi>=0.116.1,<1",
  "httpx>=0.28.1,<1",
  "orjson>=3.11.3,<4",
  "pillow>=11,<12",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
  "psycopg[binary]>=3.2.10,<4",
  "python-multipart>=0.0.20,<1",
  "pyjwt[crypto]>=2.10.1,<3",
  "redis>=6.4.0,<7",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.138.15,<7",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.10,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
